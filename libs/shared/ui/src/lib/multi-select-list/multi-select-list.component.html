<div class="form-group select-field" [class.open]="open">
  <div class="select-field__container" (emClickOutside)="closeDropdown()">
    <div class="form-control" (click)="toggle()" [class.disabled]="!show">
      @if (selectedItems.length === 0) {
        <span class="placeholder w-100">{{ placeholder() }}</span>
      }
      @if (selectedItems?.length) {
        <div class="value">
          @for (item of selectedItems; track item; let i = $index) {
            <span class="selected-item">
              <span>{{ item?.text }}</span>
              <button class="close" (click)="onItemClick($event, item);$event.stopPropagation()">
                <svg-icon class="cancel-small-svg" [svgStyle]="{ 'fill': 'rgb(255,255,255)'}"
                          src="assets/icons/cancel.svg" />
              </button>
            </span>
          }
        </div>
      }
      <div class="arrow">
        <svg-icon src="assets/images/arrow.svg" />
      </div>
    </div>
    <div class="dropdown" [pagination]="pagination" [selector]="'dropdown'" [style.max-height]="maxHeight()"
         (emInfiniteScroll)="onScrolled()">
      <ul class="dropdown-list">
        @for (item of dataItems; track item; let i = $index) {
          <li
            (click)="onItemClick($event, item)"
            class="dropdown-item mb-1">
            <div class="circle-checkbox">
              <input type="checkbox"
                     [checked]="isSelected(item)"
                     [disabled]="!isSelected(item) || item?.isDisabled">
              <div class="check em-d-flex-center">
                <svg-icon src="assets/icons/check.svg" />
              </div>
              {{ item?.text }}
            </div>
          </li>
        }
      </ul>
      @if (!dataItems?.length) {
        <div class="dropdown-item ">Нет данных</div>
      }
    </div>
  </div>
</div>
