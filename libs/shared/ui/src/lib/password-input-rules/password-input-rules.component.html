<ul class="rules">
  <li class="rules-item" [class.error]="!passwordControl().value.length || passwordControl().hasError('minlength')">
    Не менее 8 символов
  </li>

  <li class="rules-item" [class.error]="!passwordControl().value.length || passwordControl().hasError('latinUppercasePattern')">
    Прописные латинские буквы (A-Z)
  </li>

  <li class="rules-item" [class.error]="!passwordControl().value.length || passwordControl().hasError('latinLowercasePattern')">
    Строчные латинские буквы (a-z)
  </li>

  <li class="rules-item" [class.error]="!passwordControl().value.length || passwordControl().hasError('numberPattern')">
    Арабские цифры (0-9)
  </li>

  <li class="rules-item" [class.error]="!passwordControl().value.length || passwordControl().hasError('specialCharacterPattern')">
    Спецсимволы (` ~ ! &#64; # $ и т.д.)
  </li>

  @if (latinOnly()) {
    <li class="rules-item" [class.error]="!passwordControl().value.length || passwordControl().hasError('latinPattern')">
      Недопустимые символы
    </li>
  }

  <li class="rules-item" [class.error]="!passwordControl().value.length || (passwordControl().value !== confirmPasswordControl().value)">
    Пароли совпадают
  </li>
</ul>
