<form [formGroup]="form" (submit)="onSubmit()">
  <em-header2 [showBreadcrumb]="true">
    <div class="d-flex-sb w-100" header-center-default>
      <div class="title-h1">{{ cashbackLimitDetail?.name || "Добавить лимит для кэшбэка" }}</div>
      <div class="em-d-flex em-ai-center">
        <div class="v-line mr-1 pr-1">
          <button type="button" class="button-tooltip" (click)="back()" [class.disabled]="submitted">
            <svg-icon src="assets/icons/cancel.svg" />
            <span class="tooltip-text">Отмена</span>
          </button>
        </div>
        <div class="v-line pr-1">
          <button type="button" class="button-tooltip" (click)="onSubmit()" [class.disabled]="submitted">
            <svg-icon src="assets/icons/save.svg" />
            <span class="tooltip-text">Сохранить</span>
          </button>
        </div>
        <div *ngxPermissionsOnly="'CashbackLimitActiveStatus'" class="em-d-flex-center em-g-8 ml-1">
          <div class="toggle-title">Активировать</div>
          <label class="toggle-checkbox">
            <input type="checkbox" formControlName="isActive">
            <span></span>
          </label>
        </div>
      </div>
    </div>
  </em-header2>
  <div class="padding-6 category-edit">
    <div class="form">
      <div class="label">Наименование*</div>
      <div class="input">
        <input formControlName="name" type="text" class="form-control" placeholder="Введите наименование"
               [class.is-invalid]="f['name']?.invalid && f['name']?.touched">
        <em-validator [fieldControl]="f['name']" />
      </div>
    </div>
    <div class="form" formGroupName="limitParamJson">
      <div class="label">Сумма</div>
      <div class="input">
        <input formControlName="amount" type="text" class="form-control" placeholder="Введите сумму"
               mask="separator.2"
               [class.is-invalid]="limitParamJsonControls['amount']?.invalid && limitParamJsonControls['amount']?.touched">
        <em-validator [fieldControl]="limitParamJsonControls['amount']" />
      </div>
    </div>
    <div class="form" formGroupName="limitParamJson">
      <div class="label">Выбор категории:</div>
      <div class="input">
        <em-simple-select-list formControlName="cashbackLimitTypeId"
          action="Выберите категорию"
          [dataSource]="cashbackLimitTypes" />
        <em-validator [fieldControl]="limitParamJsonControls['cashbackLimitTypeId']" />
      </div>
    </div>
  </div>
</form>
<em-toast />
