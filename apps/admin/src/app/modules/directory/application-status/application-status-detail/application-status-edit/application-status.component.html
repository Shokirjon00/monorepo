<form [formGroup]="form" (submit)="onSubmit()">
  <em-header2 [showBreadcrumb]="true">
    <div class="d-flex-sb w-100" header-center-default>
      <div class="title-h1">{{ merchantApplicationStatusDetail?.name || "Добавить статус заявок" }}</div>
      <div class="em-d-flex em-ai-center">
        <div class="v-line mr-1 pr-1">
          <button type="button" class="button-tooltip" (click)="back()" [class.disabled]="submitted">
            <svg-icon src="assets/icons/cancel.svg" />
            <span class="tooltip-text">Отмена</span>
          </button>
        </div>
        <div class="v-line pr-1">
          <button type="button" class="button-tooltip" (click)="onSubmit()" [class.disabled]="submitted">
            <svg-icon src="assets/icons/save.svg" />
            <span class="tooltip-text">Сохранить</span>
          </button>
        </div>
        <div class="em-d-flex-center em-g-8 ml-1">
          <div class="toggle-title">СМС</div>
          <label class="toggle-checkbox">
            <input type="checkbox" formControlName="canNotify">
            <span></span>
          </label>
        </div>
        <div class="em-d-flex-center em-g-8 ml-1">
          <div class="toggle-title">Активировать</div>
          <label class="toggle-checkbox">
            <input type="checkbox" formControlName="isActive">
            <span></span>
          </label>
        </div>
      </div>
    </div>
  </em-header2>
  <div class="padding-6 balance-limit">
    <div class="form">
      <div class="label">Наименование*</div>
      <div class="input">
        <input formControlName="name" type="text" class="form-control" placeholder="Введите наименование"
               [class.is-invalid]="f['name']?.invalid && f['name']?.touched">
        <em-validator [fieldControl]="f['name']" />
      </div>
    </div>
    <div class="form">
      <div class="label">Текст сообщении*</div>
      <div class="input">
        <input formControlName="notificationText" type="text" class="form-control" placeholder="Введите текст сообщении"
               [class.is-invalid]="f['notificationText']?.invalid && f['notificationText']?.touched">
        <em-validator [fieldControl]="f['notificationText']" />
      </div>
    </div>
    <div class="form">
      <div class="label">Тип*</div>
      <div class="input">
        <em-autocomplete [searchable]="true"
          [placeholder]="'Выберите тип'"
          formControlName="applicationTypeId"
          [selectWithOutSearch]="true"
          [path]="applicationTypesApi" />
        <em-validator [fieldControl]="f['applicationTypeId']" />
      </div>
    </div>
  </div>
</form>
<em-toast />
