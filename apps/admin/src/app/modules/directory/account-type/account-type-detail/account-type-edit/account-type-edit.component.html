<form [formGroup]="form" (submit)="onSubmit()">
  <em-header2 [showBreadcrumb]="true">
    <div class="d-flex-sb w-100" header-center-default>
      <div class="title-h1">{{ acTypeDetail?.name || "Добавить тип счета" }}</div>
      <div class="em-d-flex em-ai-center">
        <div class="v-line mr-1 pr-1">
          <button type="button" class="button-tooltip" (click)="back()" [class.disabled]="submitted">
            <svg-icon src="assets/icons/cancel.svg" />
            <span class="tooltip-text">Отмена</span>
          </button>
        </div>
        <div class="v-line pr-1">
          <button type="button" class="button-tooltip" (click)="onSubmit()" [class.disabled]="submitted">
            <svg-icon src="assets/icons/save.svg" />
            <span class="tooltip-text">Сохранить</span>
          </button>
        </div>
        <div *ngxPermissionsOnly="'AccountTypeActiveStatus'" class="em-d-flex-center em-g-8 ml-2">
          <div class="toggle-title">Активировать</div>
          <label class="toggle-checkbox">
            <input type="checkbox" formControlName="isActive">
            <span></span>
          </label>
        </div>
      </div>
    </div>
  </em-header2>
  <div class="padding-6 balance-limit">
    <div class="form">
      <div class="label">Код*</div>
      <div class="input">
        <input formControlName="code" type="text" class="form-control" placeholder="Введите код"
               [class.is-invalid]="f['code']?.invalid && f['code']?.touched">
        <em-validator [fieldControl]="f['code']" />
      </div>
    </div>
    <div class="form">
      <div class="label">Наименование*</div>
      <div class="input">
        <input formControlName="name" type="text" class="form-control" placeholder="Введите наименование"
               [class.is-invalid]="f['name']?.invalid && f['name']?.touched">
        <em-validator [fieldControl]="f['name']" />
      </div>
    </div>
    <div class="form">
      <div class="label">Код ABS*</div>
      <div class="input">
        <input formControlName="extCodeAbs" type="text" class="form-control" placeholder="Введите код ABS"
               [class.is-invalid]="f['extCodeAbs']?.invalid && f['extCodeAbs']?.touched">
        <em-validator [fieldControl]="f['extCodeAbs']" />
      </div>
    </div>
    <div class="form">
      <div class="label">Код счёта ABS</div>
      <div class="input">
        <input formControlName="extCodeObjectAbs" type="text" class="form-control" placeholder="Введите код счёта ABS">
        <em-validator [fieldControl]="f['extCodeObjectAbs']" />
      </div>
    </div>
    <div class="form">
      <div class="label">Шлюз*</div>
      <div class="input">
        <em-simple-select-list formControlName="gatewayId"
          [dataSource]="gateways"
          action="Выберите шлюз" />
        <em-validator [fieldControl]="f['gatewayId']" />
      </div>
    </div>
    <div class="form">
      <div class="label">Категория типа счета*</div>
      <div class="input">
        <em-simple-select-list formControlName="accountCategoryTypeId"
          [dataSource]="accountCategoryTypes"
          action="Выберите категорию типа счета" />
        <em-validator [fieldControl]="f['accountCategoryTypeId']" />
      </div>
    </div>
    <div class="form">
      <div class="label">Классификация счёта</div>
      <div class="input">
        <em-simple-select-list formControlName="accountClassificationId"
          [dataSource]="accountClassificationId"
          action="Выберите классификация счёта" />
      </div>
    </div>
  </div>
</form>
<em-toast />
