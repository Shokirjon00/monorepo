<em-header2 [showBreadcrumb]="true">
  <div class="d-flex-sb w-100" header-center-default>
    <div class="title-h1 w-100">Информация</div>
    <div class="em-d-flex em-ai-center">
      <div *ngxPermissionsOnly="'BranchUpdate'">
        <button type="button" class="button-tooltip" (click)="navigateToUpdate()">
          <svg-icon src="assets/icons/pen.svg" />
          <span class="tooltip-text">Редактировать</span>
        </button>
      </div>
    </div>
  </div>
</em-header2>
<div class="padding-7">
  <div class="em-d-flex em-g-16 w-50">
    <div class="labels">
      <div><span>Код</span><span>:</span></div>
      <div><span>Наименование*</span><span>:</span></div>
      <div><span>Адрес</span><span>:</span></div>
      <div><span>Код ABS*</span><span>:</span></div>
      <div><span>Статус</span><span>:</span></div>
    </div>
    <div class="data">
      <span>{{ branchDetail?.code || '-' }}</span>
      <span>{{ branchDetail?.name || '-' }}</span>
      <span>{{ branchDetail?.address || '-' }}</span>
      <span>{{ branchDetail?.extCodeAbs || '-' }}</span>
      <span>{{ branchDetail?.statusName || '-' }}</span>
    </div>
  </div>
</div>
