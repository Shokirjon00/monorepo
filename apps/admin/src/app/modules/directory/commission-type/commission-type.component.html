<em-header2
  [tabMenuItems]="tabMenuItems"
  [enableDropdown]="true"
  [filterFields]="columns"
  [filterStorageKey]="'CommissionTypeFilters'">
  <ng-container header-actions>
    @if (paginate) {
      <em-pagination class="pl-3"
        [page]="paginate" />
    }
  </ng-container>
</em-header2>
<em-table (sortChange)="sortTable($event)"
  [dataSource]="commissionTypes"
  [captions]="columns"
  [captionKey]="captionKey"
  [loading]="loading()"
 />
