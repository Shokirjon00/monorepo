<em-header2
  [filterFields]="columns"
  [filterStorageKey]="'iftLogFiltersForm'">
  <div class="d-flex-sb w-100" header-center-default>
    <span class="title-h1">Журнал событий IFT</span>
  </div>
  <ng-container header-actions>
    @if (paginate) {
      <em-pagination class="pl-3"
        [page]="paginate" />
    }
  </ng-container>
</em-header2>

<em-table (sortChange)="sortTable($event)"
  (detail)="showDetail($event)"
  [dataSource]="iftLogs"
  [captions]="columns"
  [loading]="loading()"
  [captionKey]="captionKey"
 />
@if (loading()) {
  <em-eb-loader class="form-loader" />
}
