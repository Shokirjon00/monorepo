<em-header2
  [tabMenuItems]="tabMenuItems"
  [filterFields]="columns"
  [filterStorageKey]="'systemsNotificationFiltersForm'">
  <ng-container header-actions>
    @if (paginate) {
      <em-pagination class="pl-3"
        [page]="paginate" />
    }
  </ng-container>
</em-header2>
<em-table (detail)="detail($event)"
  (edit)="edit($event)"
  (sortChange)="sortTable($event)"
  [dataSource]="balanceLimits"
  [captions]="columns"
  [rowActions]="tableActions"
  [loading]="loading()" />
@if (loading()) {
  <em-eb-loader class="form-loader" />
}
