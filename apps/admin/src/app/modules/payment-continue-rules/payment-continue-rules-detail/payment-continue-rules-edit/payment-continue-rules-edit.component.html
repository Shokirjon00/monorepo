<form [formGroup]="form" (submit)="onSubmit()">

  <em-header2 [showBreadcrumb]="true">
    <div class="d-flex-sb w-100" header-center-default>
      <div class="title-h1">{{updateUrl === 'new' ? "Добавить" : "Редактировать"}}</div>
      <div class="em-d-flex em-ai-center">
        <div class="v-line mr-1 pr-1">
          <button type="button" class="button-tooltip" (click)="back()" [class.disabled]="submitted">
            <svg-icon src="assets/icons/cancel.svg" />
            <span class="tooltip-text">Отмена</span>
          </button>
        </div>
        <div class="v-line pr-1">
          <button type="button" class="button-tooltip" (click)="onSubmit()" [class.disabled]="submitted">
            <svg-icon src="assets/icons/save.svg" />
            <span class="tooltip-text">Сохранить</span>
          </button>
        </div>
        <div *ngxPermissionsOnly="'PaymentContinueRuleActiveStatus'" class="em-d-flex-center em-g-8 ml-1">
          <div class="toggle-title">Активировать</div>
          <label class="toggle-checkbox">
            <input type="checkbox" formControlName="isActive">
            <span></span>
          </label>
        </div>
      </div>
    </div>
  </em-header2>

  <div class="padding-6">
    <div class="form">
      <div class="label">Текущий статус платежа*</div>
      <div class="input">
        <em-autocomplete formControlName="paymentStatusId"
          [placeholder]="'Статус платежа'"
          [searchable]="true"
          [selectWithOutSearch]="true"
          [path]="apiPaymentStatusesPath" />
        <em-validator [fieldControl]="f['paymentStatusId']" />
      </div>
    </div>
    <div class="form">
      <div class="label">Текущий статус синхронизации платежа</div>
      <div class="input">
        <em-autocomplete formControlName="paymentSyncStatusId"
          [placeholder]="'Текущий статус синхронизации платежа'"
          [searchable]="true"
          [selectWithOutSearch]="true"
          [path]="apiPaymentSyncStatusesPath" />
        <em-validator [fieldControl]="f['paymentSyncStatusId']" />
      </div>
    </div>
    <div class="form">
      <div class="label">Шлюз списания*</div>
      <div class="input">
        <em-autocomplete formControlName="fromGatewayId"
          [placeholder]="'Шлюз списания'"
          [searchable]="true"
          [selectWithOutSearch]="true"
          [path]="apiGatewaysPath" />
        <em-validator [fieldControl]="f['fromGatewayId']" />
      </div>
    </div>
    <div class="form">
      <div class="label">Шлюз пополнения*</div>
      <div class="input">
        <em-autocomplete formControlName="toGatewayId"
          [searchable]="true"
          [selectWithOutSearch]="true"
          [placeholder]="'Шлюз пополнения'"
          [path]="apiGatewaysPath" />
        <em-validator [fieldControl]="f['toGatewayId']" />
      </div>
    </div>
  </div>
</form>
<em-toast />
