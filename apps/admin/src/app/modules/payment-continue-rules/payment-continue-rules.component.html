<em-header2
  [filterFields]="columns"
  [actions]="actions"
  [filterStorageKey]="'continueRulesFiltersForm'"
  [pageTitle]="header.title">
  <ng-container header-actions>
    <div class="d-flex-sb pl-3 v-line-left">
      @for (action of actions; track action) {
        <em-actions [actionData]="action" />
      }
    </div>
    @if (paginate) {
      <em-pagination class="pl-3"
        [page]="paginate" />
    }
  </ng-container>
</em-header2>
<em-table (detail)="detail($event)"
  (edit)="edit($event)"
  (sortChange)="sortTable($event)"
  [dataSource]="paymentRules"
  [captions]="columns"
  [rowActions]="tableActions"
  [captionKey]="captionKey"
  [loading]="loading()"
 />
<em-toast />
