<em-header2 [showBreadcrumb]="true">
  <div class="d-flex-sb w-100" header-center-default>
    <div class="title-h1 w-100 v-line">Информация</div>
    <div class="em-d-flex em-ai-center">
      <div *ngxPermissionsOnly="'IssueMoneySettingUpdate'" class="icon ml-3">
        <button type="button" class="button-tooltip" (click)="navigateToUpdate()">
          <svg-icon src="assets/icons/pen.svg" />
          <span class="tooltip-text">Редактировать</span>
        </button>
      </div>
    </div>
  </div>
</em-header2>

@if (settings) {
  <div>
    <div class="padding-7">
      <div class="em-d-flex em-g-16 w-50">
        <div class="labels">
          <div><span>Организация</span><span>:</span></div>
          <div><span>Статус</span><span>:</span></div>
        </div>
        <div class="data">
          <span>{{ settings.companyName || '-' }}</span>
          <span>{{ settings.statusName || '-' }}</span>
        </div>
      </div>
    </div>
    <em-table [dataSource]="settings.merchants"
      [captions]="captions"
      [loading]="loading"
     />
  </div>
}
<em-toast />
