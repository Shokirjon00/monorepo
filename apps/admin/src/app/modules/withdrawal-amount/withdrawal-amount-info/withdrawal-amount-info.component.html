<em-header2
  [tabMenuItems]="tabMenuItems"
  [filterFields]="columns"
  [actions]="actions"
  [filterStorageKey]="'withdrawalAmountInfoFiltersForm'">
  <ng-container header-actions>
    <div class="action-line pl-3">
      @for (action of actions; track action) {
        <em-actions [actionData]="action" />
      }
    </div>
    @if (paginate) {
      <em-pagination class="pl-3"
        [page]="paginate" />
    }
  </ng-container>
</em-header2>

<em-table (detail)="showDetail($event)"
  [dataSource]="withdrawalAmounts"
  (link)="link($event)"
  (sortChange)="sortTable($event)"
  [captions]="columns"
  [rowActions]="tableActions"
  [captionKey]="captionKey"
  [loading]="loading()"
  [linkField]="'Все организации'" />
