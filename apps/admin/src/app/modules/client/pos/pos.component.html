<em-header2
  [tabMenuItems]="tabMenuItems"
  [enableDropdown]="true"
  [showBreadcrumb]="showBreadcrumbs"
  [filterFields]="showFilters ? columns : []"
  [actions]="actions"
  [filterStorageKey]="'posesFiltersForm'">
  <ng-container header-actions>
    <div class="d-flex-sb pl-3 v-line-left">
      @for (action of actions; track action) {
        <em-actions [actionData]="action"
          [columns]="columns" />
      }
    </div>
    @if (paginate) {
      <em-pagination class="pl-3"
        [page]="paginate" />
    }
  </ng-container>
</em-header2>
<em-table (detail)="showDetail($event)"
  (edit)="edit($event)"
  (link)="link($event)"
  (sortChange)="sortTable($event)"
  [dataSource]="posses"
  [captions]="columns"
  [rowActions]="tableActions"
  [page]="paginate"
  [loading]="loading"
  [captionKey]="captionKey"
 />
<em-toast />
