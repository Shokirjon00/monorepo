<em-header2
  [tabMenuItems]="tabMenuItems"
  [showBreadcrumb]="true"
  [actions]="actions"
  [enableDropdown]="true"
  [filterStorageKey]="'companyFiltersForm'">
  <ng-container header-actions>
    <div class="d-flex-sb pl-3 v-line-left">
      @for (action of actions; track action) {
        <em-actions (syncStatus)="syncStatus(companyId)"
          [actionData]="action" />
      }
    </div>
    @if (paginate) {
      <em-pagination class="pl-3"
        [page]="paginate" />
    }
  </ng-container>
</em-header2>
<em-table (sortChange)="sortTable($event)"
  [dataSource]="companyAcquirers"
  [captions]="captions"
  [rowActions]="tableActions"
  [captionKey]="captionKey"
  [loading]="loading"
  (remove)="deleteCompanyAcquirer($event)"
 />
<em-toast />
