<em-header2
  [filterFields]="columns"
  [actions]="actions"
  [filterStorageKey]="'accountHistoryFiltersForm'">
  <div class="d-flex-sb w-100" header-center-default>
    <span class="title-h1">История счета</span>
  </div>
  <ng-container header-actions>
    <div class="d-flex-sb pl-3 v-line-left">
      @for (action of actions; track action) {
        <em-actions [actionData]="action" />
      }
    </div>
    @if (paginate) {
      <em-pagination class="pl-3"
      [page]="paginate" />
    }
  </ng-container>
</em-header2>
<em-table (sortChange)="sortTable($event)"
  [dataSource]="accountsHistory"
  [captions]="columns"
  [captionKey]="captionKey"
  [loading]="loading"
 />
