<em-header2
  [tabMenuItems]="tabMenuItems"
  [enableDropdown]="true"
  [showBreadcrumb]="false"
  [filterFields]="columns"
  [actions]="actions"
  [filterStorageKey]="'merchantFiltersForm'"
  defaultFilterField="name">
  <ng-container header-actions>
    <div class="d-flex-sb pl-3 v-line-left">
      @for (action of actions; track action) {
        <em-actions [actionData]="action"
        [columns]="columns" />
      }
    </div>
    @if (paginate) {
      <em-pagination class="pl-3"
      [page]="paginate" />
    }
  </ng-container>
</em-header2>
<em-table (changeStatus)="confirmChangeStatus($event)"
  (detail)="showDetail($event)"
  (edit)="edit($event)"
  (sortChange)="sortTable($event)"
  (link)="link($event)"
  [dataSource]="merchants"
  [captions]="columns"
  [rowActions]="tableActions"
  [optionActions]="optionActions"
  [page]="paginate"
  [loading]="loading()"
  [captionKey]="captionKey"
 />
<em-toast />
@if (loading()) {
  <em-eb-loader class="form-loader" />
}
