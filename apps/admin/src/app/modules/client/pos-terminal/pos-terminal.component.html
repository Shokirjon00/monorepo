<em-header2
  [tabMenuItems]="tabMenuItems"
  [showBreadcrumb]="true">
  <ng-container header-actions>
    @if (paginate) {
      <em-pagination class="pl-3"
      [page]="paginate" />
    }
  </ng-container>
</em-header2>
<em-table (detail)="showDetail($event)"
  (edit)="edit($event)"
  (remove)="deletePosTerminal($event)"
  (sortChange)="sortTable($event)"
  [dataSource]="posTerminal"
  [captions]="columns"
  [rowActions]="tableActions"
  [captionKey]="captionKey"
  [page]="paginate"
  [loading]="loading()"
 />
@if (loading()) {
  <em-eb-loader class="loader" />
}
