<form [formGroup]="form" (submit)="onSubmit()">
  <em-header2 [showBreadcrumb]="true">
    <div class="d-flex-sb w-100"  header-center-default>
        <span class="title-h1">{{acTypeDetail?.name || "Редактировать"}}</span>
        <div class="em-d-flex">
          <div class="v-line mr-1 pr-1">
            <button type="button" class="button-tooltip" (click)="back()" [class.disabled]="submitted">
              <svg-icon src="assets/icons/cancel.svg" />
              <span class="tooltip-text">Отмена</span>
            </button>
          </div>
          <div class="v-line pr-1">
            <button type="button" class="button-tooltip" (click)="onSubmit()" [class.disabled]="submitted">
              <svg-icon src="assets/icons/save.svg" />
              <span class="tooltip-text">Сохранить</span>
            </button>
          </div>
        </div>
      </div>
  </em-header2>

  <div class="padding-6 balance-limit">
    <div class="form">
      <div class="label">Номер телефона*</div>
      <div class="input">
        <input type="text" class="form-control" formControlName="phoneNumber" placeholder="+992 (ХХ) ХХХ ХХ ХХ"
               mask="+000 (00) 000 00 00" [dropSpecialCharacters]=true
               [class.is-invalid]="f['phoneNumber']?.invalid && f['phoneNumber']?.touched">
        <em-validator [fieldControl]="f['phoneNumber']" />
      </div>
    </div>
    <div class="form">
      <div class="label">Серийный номер</div>
      <div class="input">
        <input formControlName="number"  type="text" class="form-control" placeholder="Введите серийный номер"
               [class.is-invalid]="f['number']?.invalid && f['number']?.touched">
        <em-validator [fieldControl]="f['number']" />
      </div>
    </div>
    <div class="form">
      <div class="label">Код ABS*</div>
      <div class="input">
        <input formControlName="extCodeAbs" type="text" class="form-control" placeholder="Введите ABS код"
               [class.is-invalid]="f['extCodeAbs']?.invalid && f['extCodeAbs']?.touched">
        <em-validator [fieldControl]="f['extCodeAbs']" />
      </div>
    </div>
    <div class="form">
      <div class="label">Адрес</div>
      <div class="input">
        <input formControlName="address" type="text" class="form-control" placeholder="Введите адрес">
      </div>
    </div>
    <div class="form">
      <div class="label">Наименование</div>
      <div class="input">
        <input formControlName="name"  type="text" class="form-control" placeholder="Введите наименование">
      </div>
    </div>
    <div class="form">
      <div class="label">Модель</div>
      <div class="input">
        <input formControlName="model"  type="text" class="form-control" placeholder="Введите наименование">
      </div>
    </div>
    <div class="form">
      <div class="label">Операционная система</div>
      <div class="os">
        <input formControlName="os"  type="text" class="form-control" placeholder="Введите наименование">
      </div>
    </div>
  </div>
  <div class="padding-6">
    <div class="form">
      <div class="label">Организация*</div>
      <div class="input">
        <em-autocomplete [searchable]="true"
          formControlName="companyId"
          [placeholder]="'Выберите организацию'"
          [selectWithOutSearch]="true"
          (changed)="selectedCompany($event)"
          [path]="companyDictionaryApi" />
        <em-validator [fieldControl]="f['companyId']" />
      </div>
    </div>
    <div class="form">
      <div class="label">Торговая точка*</div>
      <div class="circle-check">
        <div class="input">
          <em-multi-select placeholder="Выберите торговые точки"
            formControlName="merchants"
            [disable]="merchantDisabled"
            [dataSource]="merchantsDictionary"
            (changed)="changeMerchant($event)"
            [singleSelect]="true" />
          <em-validator [fieldControl]="f['merchants']" />
        </div>
      </div>
    </div>
    <div class="form">
      <div class="label">Кассы*</div>
      <div class="circle-check">
        <div class="input">
          <em-multi-select placeholder="Выберите кассы"
            formControlName="poses"
            [disable]="posesDisabled"
            [dataSource]="posesDictionary"
            [singleSelect]="true" />
          <em-validator [fieldControl]="f['poses']" />
        </div>
      </div>
    </div>
  </div>
</form>
<em-toast />
