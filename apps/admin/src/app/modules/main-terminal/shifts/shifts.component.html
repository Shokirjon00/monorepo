<em-header2
  [tabMenuItems]="tabMenuItems"
  [filterFields]="columns"
  [filterStorageKey]="'shiftFiltersForm'">
  <ng-container header-actions>
    <div class="d-flex-sb pl-3 v-line-left">
      @for (action of actions; track action.code) {
        <em-actions [actionData]="action" />
      }
    </div>
    @if (paginate) {
      <em-pagination class="pl-3"
        [page]="paginate" />
    }
  </ng-container>
</em-header2>
<em-table (changeStatus)="confirmChangeStatus($event)"
  (detail)="showDetail($event)"
  (sortChange)="sortTable($event)"
  (print)="openReceiptDialog($event)"
  (link)="link($event)"
  [dataSource]="posTerminal"
  [captions]="columns"
  [rowActions]="tableActions"
  [optionActions]="optionActions"
  [captionKey]="captionKey"
  [loading]="loading()"
 />
@if (loading()) {
  <em-eb-loader class="loader" />
}
