<form class="w-100" [formGroup]="form" (submit)="onSubmit()">
  <em-header2 [showBreadcrumb]="true">
    <div class="d-flex-sb w-100" header-center-default>
      <div class="title-h1">Редактировать настройки отчётов</div>
      <div class="em-d-flex">
        <div class="v-line mr-1 pr-1">
          <button type="button" class="button-tooltip" (click)="back()" [class.disabled]="submitted">
            <svg-icon src="assets/icons/cancel.svg" />
            <span class="tooltip-text">Отмена</span>
          </button>
        </div>
        <div class="v-line pr-1">
          <button type="button" class="button-tooltip" (click)="onSubmit()" [class.disabled]="submitted">
            <svg-icon src="assets/icons/save.svg" />
            <span class="tooltip-text">Сохранить</span>
          </button>
        </div>
        <div class="checkbox-toggle ml-1">
          <div class="toggle-title">Активировать</div>
          <input type="checkbox" id="switch" formControlName="isActive"/>
          <label for="switch"></label>
        </div>
      </div>
    </div>
  </em-header2>
  <div class="balance-limit padding-6" [class.blur]="submitted">
    <div class="em-d-flex">
      <div class="w-50 v-line pr-6">
        <div class="form">
          <div class="label">Наименование*</div>
          <div class="input">
            <input formControlName="name" type="text" class="form-control" placeholder="Введите наименование"
                   [class.is-invalid]="f['name']?.invalid && f['name']?.touched">
            <em-validator [fieldControl]="f['name']" />
          </div>
        </div>
        <div class="form">
          <div class="label">Описание</div>
          <div class="input">
        <textarea formControlName="paramsDescription" class="form-control"
                  placeholder="Введите описание"
                  [class.is-invalid]="f['paramsDescription']?.invalid && f['paramsDescription']?.touched"></textarea>
            <em-validator [fieldControl]="f['paramsDescription']" />
          </div>
        </div>
      </div>
      <div class="w-50 pl-6">
        <div class="form">
          <div class="label mb-1">Документы</div>
          <div class="input em-d-flex">
            <em-upload-field formControlName="templateFileId"
              permissionName="ClientReportsUploadTemplateFile"
              formStyle="item"
              placeHolder="Загрузить документ DOCX,  EXCEL не более 5мб"
              [fileLimit]="1"
              [canPrint]="false"
              [fileTypes]="['application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', 'application/vnd.ms-excel', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet']"
              [memType]="uploadFile.memType"
              [uploadPath]="uploadFile.uploadPath"
              [fileStorageUrl]="fileStorageUrl"
              [fileStorageToken]="fileStorageToken" />
          </div>
        </div>
      </div>
    </div>
    <em-html-viewer [htmlCode]="settingUpdate?.htmlCode" />
  </div>
  @if (submitted) {
    <em-eb-loader class="form-loader" />
  }
</form>
<em-toast />
