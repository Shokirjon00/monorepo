<div class="confirm-dialog em-d-flex em-dr-columm em-g-40">
  <div class="em-d-flex-center em-dr-columm em-g-16">
    <div class="title text-center">Изменения статуса платежей</div>
  </div>
  <div class="form mb-0">
    <div class="input">
      <em-simple-select-list [action]="'Выберите статус платежа'"
        [dataSource]="orderStatus"
        (changed)="selectOrderStatus($event)" />
    </div>
  </div>
  <div class="em-d-flex em-jc-c">
    <button class="btn btn-secondary btn-lg mr-2" (click)="onCancel()">Отменить</button>
    <button class="btn btn-primary btn-lg" (click)="onConfirm()" [disabled]="!selectedStatusId">Сохранить</button>
  </div>
</div>
