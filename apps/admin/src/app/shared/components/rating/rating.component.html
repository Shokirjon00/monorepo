<div class="rating">
  @for (isFilled of stars; track $index; let i = $index) {
    <div class="star">
      @if (isFilled) {
        <svg-icon src="assets/icons/star-filled.svg" class="star-icon" />
      } @else {
        <svg-icon src="assets/icons/star-stroke.svg" class="star-icon" />
      }
    </div>
  }
</div>
