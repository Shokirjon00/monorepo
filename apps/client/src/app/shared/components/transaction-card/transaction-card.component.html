<div class="em-d-flex">
  @for (card of transactionCards; track card) {
    <div class="transaction-card mr-5" >
      <div class="transaction-card__item">
        <div class="transaction-card__header em-d-flex">
          <img src="{{card.img}}" alt="">
          <div class="em-subtitle em-fw-500 em-font">{{card.title}}</div>
        </div>
        <div class="transaction-card__body">
          <div class="transaction-card__body-title em-font em-title em-fw-500">{{card.amount}}</div>
          <div class="transaction-card__body-title em-font em-subtitle em-fw-400">{{card.quantity}}</div>
          <div class="transaction-card__body-subtitle em-font  em-subtitle em-fw-500">{{card.percent}}</div>
        </div>
      </div>
      <div class="mt-3">
        <div class="em-font em-fw-500 em-subtitle em-lS-color mb-1">Средний чек</div>
        <div class="em-font em-fw-500 em-title">10254, 25 с</div>
      </div>
    </div>
  }
</div>
